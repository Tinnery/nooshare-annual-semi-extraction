name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      corpus_mode:
        description: "H1 corpus operation"
        type: choice
        options:
          - sample
          - inventory
          - full
        default: sample
        required: true
      corpus_limit:
        description: "Sample limit (ignored for inventory/full)"
        type: string
        default: "10"
        required: false
      batch_size:
        description: "Full-run chunk size"
        type: string
        default: "1000"
        required: false
      expected_total:
        description: "Expected object count from the inventory snapshot"
        type: string
        default: "113526"
        required: false
      start_after:
        description: "Resume after this last committed S3 key"
        type: string
        default: ""
        required: false
      processed_before:
        description: "Number of objects already committed before the resume cursor"
        type: string
        default: "0"
        required: false
      process_limit:
        description: "Maximum records for this invocation (0=unbounded)"
        type: string
        default: "0"
        required: false
      start_year:
        description: "Report year lower bound (minimum 2019)"
        type: string
        default: "2019"
        required: false

      workspace_source_export:
        description: Export the exact source revision, tests and fixtures as an Actions artifact
        type: boolean
        default: false
      workspace_source_ref:
        description: Commit SHA, branch or tag to export (empty uses the workflow commit)
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Run tests
      # CI 无 PG 环境：模板库未配置，全部测试走注入 mock / 降级路径
      run: uv run pytest

  # 真连基础设施探针：经 stunnel 验证 PG / RustFS 连通性 + 零泄露证伪。
  # 与 test job 解耦：凭据仅在 environment 作用域注入，失败不阻塞普通测试结论。
  infra-probe:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    concurrency:
      group: nooshare-ci-probe-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ci-probe
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install stunnel, psql, boto3
      run: |
        sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update -qq
        sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq stunnel4 postgresql-client netcat-openbsd
        python3 -m pip install --quiet --retries 5 --timeout 30 boto3

    # 隧道与所有探针必须在同一 step：GitHub Actions 会回收上一步派生的后台进程，
    # 独立的 build step 会导致 stunnel 在探针 step 启动时已被杀（PG_LOCAL_REFUSED）。
    - name: Tunnel + probes + leak falsification (single lifecycle)
      env:
        NOOSHARE_INFRA: ${{ secrets.NOOSHARE_INFRA }}
      run: |
        set -euo pipefail
        # 解析 JSON secret 为独立 env 变量
        export STUNNEL_HOST="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_host)"
        export STUNNEL_PSK="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_psk)"
        export PG_PASSWORD="$(echo "$NOOSHARE_INFRA" | jq -r .pg_password)"
        export PG_USER="$(echo "$NOOSHARE_INFRA" | jq -r .pg_user)"
        export PG_NAME="$(echo "$NOOSHARE_INFRA" | jq -r .pg_db)"
        export RUSTFS_ACCESS_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_access_key)"
        export RUSTFS_SECRET_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_secret_key)"
        export RUSTFS_BUCKET="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_bucket)"
        bash scripts/ci/run_probes.sh

    - name: Upload encrypted H1 pattern library snapshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h1-pattern-library-encrypted
        path: ${{ runner.temp }}/h1_pattern_library.encrypted.json
        if-no-files-found: ignore
        retention-days: 1

    - name: Remove encrypted export from runner
      if: always()
      run: rm -f "${{ runner.temp }}/h1_pattern_library.encrypted.json"

  # H1 语料批量生产：从 RustFS annual-semi 桶下载已发布的 MD 文件，
  # 执行 H1 标题抽取，产出 JSONL 结果。与 infra-probe 解耦：
  # - infra-probe 验证基础设施（canary 往返）
  # - h1-corpus 生产研究数据（批量读取 + 抽取）
  h1-corpus:
    concurrency:
      group: nooshare-ci-probe-${{ github.repository }}
      cancel-in-progress: false
    # Regular PRs validate code without starting a RustFS data job.
    # Data jobs require an explicit mode marker; main/master pushes keep the
    # bounded 10-record sample as a connectivity smoke check.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[h1-sample]') || contains(github.event.pull_request.title, '[h1-inventory]') || contains(github.event.pull_request.title, '[h1-full]') || contains(github.event.pull_request.title, '[h1-full-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: ci-probe
    # Job-level flags are also consumed by the later artifact-upload conditions.
    env:
      CORPUS_INVENTORY_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_mode == 'inventory' || github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-inventory]')) && '1' || '0' }}
      H1_CORPUS_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_mode == 'full' || github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[h1-full]') || contains(github.event.pull_request.title, '[h1-full-smoke]'))) && '1' || '0' }}
    # H1 是数据生产 job；抽取或入库失败必须使该 job 失败。
    # 串行依赖 infra-probe：两者用同一 PSK identity 连同一 SNI router，
    # 并行时 server 端 PG 连接槽被占用，导致 psycopg2 连接被关闭
    # （server closed the connection unexpectedly）。串行后隧道不重叠。
    needs: infra-probe

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Validate H1 runners and helper scripts
      run: |
        bash -n scripts/ci/run_h1_corpus.sh scripts/ci/run_h1_corpus_full.sh
        uv run python -m py_compile scripts/ci/h1_corpus_download.py scripts/ci/h1_corpus_load_pg.py scripts/ci/summarize_h1_corpus.py annual_semi_extraction/h1/extractor.py scripts/ci/validate_h1_batch.py

    - name: Install stunnel, psql
      run: |
        sudo apt-get update -qq
        sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq stunnel4 netcat-openbsd postgresql-client

    # 隧道 + 下载 + 抽取 + PG 写入必须在同一 step（stunnel 进程组绑定）
    - name: Tunnel + corpus download + H1 extraction + PG load
      env:
        NOOSHARE_INFRA: ${{ secrets.NOOSHARE_INFRA }}
        H1_START_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.start_year || '2019' }}
        # push/PR 默认小样本；手动 workflow_dispatch 可选 sample / inventory / full。
        H1_CORPUS_LIMIT: ${{ (github.event_name == 'workflow_dispatch' && (inputs.corpus_mode == 'inventory' || inputs.corpus_mode == 'full')) && '0' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[h1-inventory]') || contains(github.event.pull_request.title, '[h1-full]') || contains(github.event.pull_request.title, '[h1-full-smoke]'))) && '0' || (github.event_name == 'workflow_dispatch' && inputs.corpus_limit) || '10' }}
        CORPUS_INVENTORY_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_mode == 'inventory' || github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-inventory]')) && '1' || '0' }}
        H1_CORPUS_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_mode == 'full' || github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[h1-full]') || contains(github.event.pull_request.title, '[h1-full-smoke]'))) && '1' || '0' }}
        H1_CORPUS_BATCH_SIZE: ${{ (github.event_name == 'workflow_dispatch' && inputs.batch_size) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-full-smoke]') && '10') || '1000' }}
        H1_EXPECTED_CORPUS_COUNT: ${{ (github.event_name == 'workflow_dispatch' && inputs.expected_total) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-full-smoke]') && '20') || '113526' }}
        H1_PROCESSED_BEFORE: ${{ github.event_name == 'workflow_dispatch' && inputs.processed_before || '0' }}
        H1_PROCESS_LIMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.process_limit) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-full-smoke]') && '20') || '0' }}
        CORPUS_START_AFTER: ${{ github.event_name == 'workflow_dispatch' && inputs.start_after || '' }}
        H1_VERIFY_PG_CORPUS: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_mode == 'full' || github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[h1-full]')) && '1' || '0' }}
      run: |
        set -euo pipefail
        # 解析 JSON secret 为独立 env 变量
        export STUNNEL_HOST="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_host)"
        export STUNNEL_PSK="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_psk)"
        export PG_PASSWORD="$(echo "$NOOSHARE_INFRA" | jq -r .pg_password)"
        export PG_USER="$(echo "$NOOSHARE_INFRA" | jq -r .pg_user)"
        export PG_NAME="$(echo "$NOOSHARE_INFRA" | jq -r .pg_db)"
        export RUSTFS_ACCESS_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_access_key)"
        export RUSTFS_SECRET_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_secret_key)"
        export RUSTFS_BUCKET="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_bucket)"
        bash scripts/ci/run_h1_corpus.sh

    - name: Upload sample H1 artifacts
      if: always() && env.H1_CORPUS_FULL != '1' && env.CORPUS_INVENTORY_ONLY != '1'
      uses: actions/upload-artifact@v4
      with:
        name: h1-corpus-sample
        path: |
          corpus-data/input-manifest.jsonl
          corpus-data/batch-summary.json
          h1-extraction.jsonl
          h1-extraction-failures.jsonl
          h1-corpus-summary.json
        retention-days: 3

    - name: Upload inventory summary only
      if: always() && env.CORPUS_INVENTORY_ONLY == '1'
      uses: actions/upload-artifact@v4
      with:
        name: h1-corpus-inventory-summary
        path: |
          corpus-data/batch-summary.json
          h1-corpus-summary.json
        retention-days: 1

    - name: Upload full-run checkpoint and summary
      if: always() && env.H1_CORPUS_FULL == '1'
      uses: actions/upload-artifact@v4
      with:
        name: h1-corpus-full-summary
        path: |
          h1-corpus-checkpoint.json
          h1-quality-summary.json
          h1-corpus-summary.json
        retention-days: 7

  # H2 语料批量抽取：从 RustFS annual-semi 桶下载已发布的 MD 文件，
  # 执行 H2（第二节）内容抽取，产出 JSONL 结果。与 H1 解耦，独立运行。
  h2-corpus:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[h2-sample]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ci-probe
    needs: infra-probe

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Validate H2 runner scripts
      run: |
        bash -n scripts/ci/run_h2_corpus.sh
        uv run python -m py_compile annual_semi_extraction/h2/__init__.py annual_semi_extraction/h2/pattern_loader.py annual_semi_extraction/h2/extractor.py annual_semi_extraction/cli.py

    - name: Install stunnel, psql
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq stunnel4 netcat-openbsd postgresql-client

    - name: Tunnel + corpus download + H2 extraction
      env:
        NOOSHARE_INFRA: ${{ secrets.NOOSHARE_INFRA }}
        H2_PATTERN_MIN_COUNT: '10'
        H2_CORPUS_LIMIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.corpus_limit) || '10' }}
      run: |
        set -euo pipefail
        # 解析 JSON secret 为独立 env 变量
        export STUNNEL_HOST="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_host)"
        export STUNNEL_PSK="$(echo "$NOOSHARE_INFRA" | jq -r .stunnel_psk)"
        export PG_PASSWORD="$(echo "$NOOSHARE_INFRA" | jq -r .pg_password)"
        export PG_USER="$(echo "$NOOSHARE_INFRA" | jq -r .pg_user)"
        export PG_NAME="$(echo "$NOOSHARE_INFRA" | jq -r .pg_db)"
        export RUSTFS_ACCESS_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_access_key)"
        export RUSTFS_SECRET_KEY="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_secret_key)"
        export RUSTFS_BUCKET="$(echo "$NOOSHARE_INFRA" | jq -r .rustfs_bucket)"
        bash scripts/ci/run_h2_corpus.sh

    - name: Upload H2 artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h2-corpus-sample
        path: |
          corpus-data/input-manifest.jsonl
          corpus-data/batch-summary.json
          h2-extraction.jsonl
          h2-extraction-failures.jsonl
          h2-corpus-summary.json
        retention-days: 7

  workspace_source_export:
    name: Workspace Source Export
    if: github.event_name == 'workflow_dispatch' && inputs.workspace_source_export == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.workspace_source_ref || github.sha }}
          fetch-depth: 0

      - name: Package tracked source, tests and fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          records = []
          excluded = []
          max_file_bytes = 50 * 1024 * 1024

          excluded_segments = {
              ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", ".runtime", ".generated",
              ".cache", "node_modules",
          }
          third_party_binary_dirs = {
              "third_party/bin", "third_party/binaries",
              "third-party/bin", "third-party/binaries",
              "offline-binaries", "offline-third-party",
          }
          tdx_raw_dirs = {
              "tdx/raw", "tdx/raw_data", "tdx/raw-data",
              "data/tdx/raw", "data/tdx/raw_data", "data/tdx/raw-data",
          }

          entries = subprocess.check_output(
              ["git", "ls-files", "-s", "-z"]
          ).split(b"\0")

          for entry in entries:
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, _blob, _stage = metadata.decode("ascii").split()
              path = raw_path.decode("utf-8", errors="strict")
              rel = PurePosixPath(path)
              parts = tuple(part.lower() for part in rel.parts)
              reason = None

              if mode == "160000":
                  reason = "git-submodule-pointer"
              elif any(part in excluded_segments for part in parts):
                  reason = "generated-or-dependency-directory"
              elif any(
                  "/".join(parts[i:i + 2]) in third_party_binary_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "offline-third-party-binary"
              elif any(
                  "/".join(parts[i:i + 2]) in tdx_raw_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "tdx-raw-data"

              source = root.joinpath(*rel.parts)
              if reason is None and not source.is_file():
                  reason = "not-a-regular-file"
              if reason is None and source.stat().st_size > max_file_bytes:
                  reason = "file-over-50-mib"

              if reason:
                  excluded.append({"path": path, "reason": reason})
                  continue

              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              file_mode = 0o755 if mode.endswith("755") else 0o644
              records.append({
                  "path": path,
                  "size": len(data),
                  "sha256": digest,
                  "mode": oct(file_mode),
              })

          records.sort(key=lambda item: item["path"])
          excluded.sort(key=lambda item: item["path"])
          manifest = {
              "schema_version": 1,
              "repository": repository,
              "commit": commit,
              "file_count": len(records),
              "fixture_file_count": sum(
                  1 for item in records
                  if any(
                      marker in part.lower()
                      for part in PurePosixPath(item["path"]).parts
                      for marker in ("test", "fixture", "sample")
                  )
              ),
              "files": records,
              "excluded_file_count": len(excluded),
              "excluded": excluded,
              "exclusion_policy": {
                  "max_file_bytes": max_file_bytes,
                  "purpose": "exclude generated dependencies, offline third-party binaries and large raw assets while retaining tracked tests and fixtures",
              },
          }
          manifest_bytes = json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, indent=2
          ).encode("utf-8")

          output_dir = Path(os.environ["RUNNER_TEMP"])
          archive_path = output_dir / "workspace-source.tar.gz"
          manifest_path = output_dir / "workspace-source-manifest.json"

          with tarfile.open(archive_path, "w:gz", compresslevel=6) as archive:
              for item in records:
                  data = root.joinpath(*PurePosixPath(item["path"]).parts).read_bytes()
                  info = tarfile.TarInfo(item["path"])
                  info.size = len(data)
                  info.mode = int(item["mode"], 8)
                  info.mtime = 0
                  archive.addfile(info, io.BytesIO(data))

              info = tarfile.TarInfo("WORKSPACE-MANIFEST.json")
              info.size = len(manifest_bytes)
              info.mode = 0o644
              info.mtime = 0
              archive.addfile(info, io.BytesIO(manifest_bytes))

          manifest_path.write_bytes(manifest_bytes)
          archive_hash = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          print(json.dumps({
              "status": "EXPORTED",
              "repository": repository,
              "commit": commit,
              "files": len(records),
              "fixture_files": manifest["fixture_file_count"],
              "excluded": len(excluded),
              "archive_bytes": archive_path.stat().st_size,
              "archive_sha256": archive_hash,
          }, sort_keys=True))
          PY

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-source.tar.gz
            ${{ runner.temp }}/workspace-source-manifest.json
          if-no-files-found: error
          retention-days: 3

  workspace_artifact_materialization:
    name: Workspace Artifact Materialization
    needs: workspace_source_export
    if: needs.workspace_source_export.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-source-artifact

      - name: Materialize and verify Python workspace snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          artifact_dir = Path("${{ runner.temp }}") / "workspace-source-artifact"
          archive_path = artifact_dir / "workspace-source.tar.gz"
          manifest_path = artifact_dir / "workspace-source-manifest.json"
          destination = Path("${{ runner.temp }}") / "materialized-python-workspace"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          destination.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive_path, "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              embedded = members.get("WORKSPACE-MANIFEST.json")
              if embedded is None or not embedded.isfile():
                  raise SystemExit("materialization failed: embedded manifest missing")
              embedded_manifest = archive.extractfile(embedded).read()
              if embedded_manifest != manifest_path.read_bytes():
                  raise SystemExit("materialization failed: manifest mismatch")

              for item in manifest["files"]:
                  path = PurePosixPath(item["path"])
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("materialization failed: unsafe archive path")
                  member = members.get(item["path"])
                  if member is None or not member.isfile():
                      raise SystemExit("materialization failed: source member missing")
                  data = archive.extractfile(member).read()
                  if len(data) != item["size"]:
                      raise SystemExit("materialization failed: file size mismatch")
                  if hashlib.sha256(data).hexdigest() != item["sha256"]:
                      raise SystemExit("materialization failed: file hash mismatch")

                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(int(item["mode"], 8))

          materialized_count = sum(
              1 for path in destination.rglob("*") if path.is_file()
          )
          if materialized_count != manifest["file_count"]:
              raise SystemExit("materialization failed: file count mismatch")

          print(json.dumps({
              "status": "MATERIALIZED_AND_VERIFIED",
              "repository": manifest["repository"],
              "commit": manifest["commit"],
              "files": materialized_count,
              "fixture_files": manifest["fixture_file_count"],
          }, sort_keys=True))
          PY
